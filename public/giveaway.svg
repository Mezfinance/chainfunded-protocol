<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0c1830"/>
      <stop offset="100%" stop-color="#06080f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1cce5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1cce5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1cce5e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1cce5e" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#1cce5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1cce5e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1cce5e" opacity="0.08"/>
    </pattern>
    <filter id="glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="circle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <ellipse cx="540" cy="450" rx="480" ry="360" fill="url(#glow)"/>

  <!-- Frame -->
  <rect x="30" y="30" width="1020" height="1020" rx="20" fill="none" stroke="#1cce5e" stroke-width="1" opacity="0.25"/>
  <!-- Corner brackets -->
  <polyline points="30,90 30,30 90,30"     fill="none" stroke="#1cce5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="990,30 1050,30 1050,90" fill="none" stroke="#1cce5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,990 30,1050 90,1050" fill="none" stroke="#1cce5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="990,1050 1050,1050 1050,990" fill="none" stroke="#1cce5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- GIVEAWAY badge -->
  <rect x="390" y="86" width="300" height="50" rx="25" fill="#1cce5e" opacity="0.1"/>
  <rect x="390" y="86" width="300" height="50" rx="25" fill="none" stroke="#1cce5e" stroke-width="1.5" opacity="0.65"/>
  <text x="540" y="119"
        font-family="'Space Grotesk','Inter',-apple-system,sans-serif"
        font-size="15" font-weight="700" fill="#1cce5e"
        text-anchor="middle" letter-spacing="6">GIVEAWAY</text>

  <!-- Headline -->
  <text x="540" y="267"
        font-family="'Space Grotesk','Inter',-apple-system,sans-serif"
        font-size="96" font-weight="800" fill="#eef4ff"
        text-anchor="middle" letter-spacing="-2">BUY 1,</text>
  <text x="540" y="380"
        font-family="'Space Grotesk','Inter',-apple-system,sans-serif"
        font-size="96" font-weight="800" fill="#1cce5e"
        text-anchor="middle" letter-spacing="-2"
        filter="url(#glow-f)">GET 1 FREE</text>

  <!-- Separator 1 -->
  <rect x="90" y="422" width="900" height="1.5" fill="url(#sep)"/>

  <!-- Body text -->
  <text x="540" y="490"
        font-family="'Inter',-apple-system,sans-serif"
        font-size="28" font-weight="400" fill="#7a9ab5"
        text-anchor="middle">The next 10 people who buy a challenge account</text>
  <text x="540" y="530"
        font-family="'Inter',-apple-system,sans-serif"
        font-size="28" font-weight="400" fill="#7a9ab5"
        text-anchor="middle">receive a free account of the same value.</text>

  <!-- 10 spot indicators — r=20, center-to-center=60, total span=580, starts at x=270 -->
  <g filter="url(#circle-glow)">
    <circle cx="270" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="330" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="390" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="450" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="510" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="570" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="630" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="690" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="750" cy="626" r="20" fill="#1cce5e"/>
    <circle cx="810" cy="626" r="20" fill="#1cce5e"/>
  </g>

  <text x="540" y="710"
        font-family="'Space Grotesk','Inter',-apple-system,sans-serif"
        font-size="40" font-weight="800" fill="#ffffff"
        text-anchor="middle" letter-spacing="2">10 SPOTS REMAINING</text>
  <text x="540" y="752"
        font-family="'Inter',-apple-system,sans-serif"
        font-size="20" font-weight="400" fill="#3d5a75"
        text-anchor="middle" letter-spacing="3">FIRST COME, FIRST SERVED</text>

  <!-- Separator 2 -->
  <rect x="90" y="800" width="900" height="1.5" fill="url(#sep)"/>

  <!-- Brand -->
  <text x="540" y="900"
        font-family="'Space Grotesk','Inter',-apple-system,sans-serif"
        font-size="36" font-weight="700"
        text-anchor="middle">
    <tspan fill="#1cce5e">Chain</tspan><tspan fill="#eef4ff">Funded</tspan>
  </text>
  <text x="540" y="948"
        font-family="'Inter',-apple-system,sans-serif"
        font-size="21" font-weight="400" fill="#1cce5e"
        text-anchor="middle">chainfunded.io</text>
  <text x="540" y="995"
        font-family="'Inter',-apple-system,sans-serif"
        font-size="15" font-weight="400" fill="#2d4258"
        text-anchor="middle" letter-spacing="2">ON-CHAIN PROP TRADING · VERIFIED PAYOUTS</text>
</svg>
