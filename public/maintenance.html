<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainFunded — Scheduled Maintenance</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        hsl(222, 47%, 5%);
      --bg-card:   hsl(222, 40%, 8%);
      --border:    hsl(222, 30%, 14%);
      --primary:   hsl(142, 76%, 46%);
      --primary-dim: hsl(142, 76%, 46%, 0.12);
      --fg:        hsl(210, 40%, 98%);
      --muted:     hsl(215, 20%, 55%);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    /* Subtle radial glow behind the card */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 30%, hsl(142, 76%, 46%, 0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 0 1px hsl(142, 76%, 46%, 0.08),
                  0 24px 64px hsl(0, 0%, 0%, 0.4);
    }

    .logo {
      width: 180px;
      height: auto;
      margin: 0 auto 2rem;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--primary-dim);
      border: 1px solid hsl(142, 76%, 46%, 0.25);
      color: var(--primary);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: var(--fg);
    }

    p {
      font-size: 0.9375rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 36ch;
      margin: 0 auto;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    .footer-note {
      font-size: 0.8125rem;
      color: hsl(215, 20%, 40%);
    }

    .footer-note a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    /* Bottom wordmark */
    .wordmark {
      margin-top: 2.5rem;
      opacity: 0.25;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/logo-full.svg" alt="ChainFunded" class="logo" />

    <div class="badge">
      <span class="badge-dot"></span>
      Scheduled Maintenance
    </div>

    <h1>We'll be back shortly</h1>

    <p>
      ChainFunded is currently undergoing scheduled maintenance.
      The platform will be back online shortly — no funds are at risk.
    </p>

    <div class="divider"></div>

    <p class="footer-note">
      For updates follow us on
      <a href="https://x.com/chainfunded" target="_blank" rel="noopener">X&nbsp;/&nbsp;Twitter</a>
      or join our
      <a href="https://discord.gg/chainfunded" target="_blank" rel="noopener">Discord</a>.
    </p>
  </div>

  <img src="/brand/wordmark-white.svg" alt="" class="wordmark" aria-hidden="true" />
</body>
</html>
