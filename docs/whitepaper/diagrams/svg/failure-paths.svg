<?xml version="1.0" encoding="UTF-8"?>
<!--
  ChainFunded whitepaper — Diagram 7
  Failure paths — branching flowchart.

  Two-level branch tree from "active challenge" to one of three
  terminal outcomes. Colour-codes the outcome by kind:
    · neutral (loss bounded to fee paid)
    · destructive (pool reverts on-chain re-check)
    · success    (USDC settles to trader)

  Same Evergreen light palette as Diagrams 1–3. Different shape
  — flowchart boxes + curved branch arrows — to signal the
  branching nature of the story.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000" font-family="'Inter','Helvetica Neue',system-ui,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b62"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg          { fill: #f7faf8; }
    .node        { fill: #ffffff; stroke: #c4d4cb; stroke-width: 1.5; }
    .node-fail   { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.75; }
    .node-pass   { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.75; }
    .node-warn   { fill: #fef7e6; stroke: #b88a00; stroke-width: 1.75; }
    .node-title  { fill: #142019; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .node-sub    { fill: #536b5e; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .outcome-tag-fail  { fill: #b91c1c; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; letter-spacing: 0.12em; }
    .outcome-tag-pass  { fill: #15803d; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; letter-spacing: 0.12em; }
    .outcome-tag-warn  { fill: #b88a00; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; letter-spacing: 0.12em; }
    .edge        { stroke: #5a6b62; stroke-width: 1.5; fill: none; }
    .edge-fail   { stroke: #b91c1c; stroke-width: 1.5; fill: none; }
    .edge-pass   { stroke: #15803d; stroke-width: 2; fill: none; }
    .edge-label  { fill: #2a3d34; font-size: 12px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; }
    .edge-label-fail { fill: #b91c1c; font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; }
    .edge-label-pass { fill: #15803d; font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; }
    .title       { fill: #142019; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle    { fill: #536b5e; font-size: 12px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; letter-spacing: 0.18em; text-transform: uppercase; }
    .caption-bg  { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.5; }
    .caption-title { fill: #15803d; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; }
    .caption-text  { fill: #142019; font-size: 13px; }
  ]]></style>

  <rect class="bg" x="0" y="0" width="1280" height="1000"/>

  <!-- Title -->
  <text class="subtitle" x="64" y="56">Figure 7 · Failure paths</text>
  <text class="title"    x="64" y="88">Where a challenge can end — three terminal outcomes</text>

  <!-- ── Root: Active challenge ───────────────────────────────────── -->
  <rect class="node" x="460" y="130" width="360" height="74" rx="10"/>
  <text class="node-title" x="640" y="160">Trader holds an active challenge</text>
  <text class="node-sub"   x="640" y="184">fee paid, account in phase 1 or 2</text>

  <line class="edge" x1="640" y1="204" x2="640" y2="248" marker-end="url(#ah)"/>

  <!-- ── Trade simulated capital ──────────────────────────────────── -->
  <rect class="node" x="460" y="250" width="360" height="74" rx="10"/>
  <text class="node-title" x="640" y="280">Trades simulated capital</text>
  <text class="node-sub"   x="640" y="304">off-chain engine tracks rules in real-time</text>

  <!-- First branch arrows -->
  <path class="edge-fail" d="M 580 324 C 580 360 240 360 240 388" marker-end="url(#ahr)"/>
  <text class="edge-label-fail" x="260" y="368">rule breached during trading</text>

  <path class="edge-pass" d="M 700 324 C 700 360 1040 360 1040 388" marker-end="url(#ahp)"/>
  <text class="edge-label-pass" x="800" y="368">profit target hit · no breach</text>

  <!-- ── Left branch — failure during trading ─────────────────────── -->
  <rect class="node-fail" x="60" y="390" width="360" height="74" rx="10"/>
  <text class="node-title" x="240" y="420">Trading engine flags account</text>
  <text class="node-sub"   x="240" y="444">no further phase / payout proofs signed</text>

  <line class="edge-fail" x1="240" y1="464" x2="240" y2="508" marker-end="url(#ahr)"/>

  <!-- Outcome A — neutral / loss bounded -->
  <rect class="node-warn" x="60" y="510" width="360" height="110" rx="10"/>
  <text class="outcome-tag-warn" x="240" y="538">OUTCOME · LOSS BOUNDED</text>
  <text class="node-title" x="240" y="566">Trader loses only the evaluation fee</text>
  <text class="node-sub"   x="240" y="588">no real money at risk beyond step 1.</text>
  <text class="node-sub"   x="240" y="606">no on-chain action required.</text>

  <!-- ── Right branch — pass + claim ──────────────────────────────── -->
  <rect class="node" x="860" y="390" width="360" height="74" rx="10"/>
  <text class="node-title" x="1040" y="420">Signers produce a payout proof</text>
  <text class="node-sub"   x="1040" y="444">N-of-M multisig · verifies P&amp;L &amp; rules</text>

  <line class="edge" x1="1040" y1="464" x2="1040" y2="508" marker-end="url(#ah)"/>

  <rect class="node" x="860" y="510" width="360" height="74" rx="10"/>
  <text class="node-title" x="1040" y="540">Trader calls claimPayout</text>
  <text class="node-sub"   x="1040" y="564">submits the proof on-chain</text>

  <!-- Sub-branch from claimPayout -->
  <path class="edge-fail" d="M 980 584 C 980 620 740 620 740 658" marker-end="url(#ahr)"/>
  <text class="edge-label-fail" x="760" y="640">on-chain rule re-check fails</text>

  <path class="edge-pass" d="M 1100 584 C 1100 620 1100 620 1100 658" marker-end="url(#ahp)"/>
  <text class="edge-label-pass" x="1120" y="640">all rules pass</text>

  <!-- Outcome B — destructive / revert -->
  <rect class="node-fail" x="560" y="660" width="360" height="110" rx="10"/>
  <text class="outcome-tag-fail" x="740" y="688">OUTCOME · POOL REVERTS</text>
  <text class="node-title" x="740" y="716">No USDC moves · proof is invalid</text>
  <text class="node-sub"   x="740" y="738">on-chain belt: contract is the final</text>
  <text class="node-sub"   x="740" y="756">word, signers can't override it.</text>

  <!-- Outcome C — success / paid -->
  <rect class="node-pass" x="940" y="660" width="280" height="110" rx="10"/>
  <text class="outcome-tag-pass" x="1080" y="688">OUTCOME · PAID</text>
  <text class="node-title" x="1080" y="716">USDC settles to trader</text>
  <text class="node-sub"   x="1080" y="738">final · non-reversible · public</text>
  <text class="node-sub"   x="1080" y="756">on every block explorer</text>

  <!-- ── Belt &amp; Braces caption ────────────────────────────────────── -->
  <rect class="caption-bg" x="60" y="830" width="1160" height="118" rx="10"/>
  <text class="caption-title" x="80" y="860">BELT &amp; BRACES — TWO INDEPENDENT GATES BEFORE USDC MOVES</text>
  <text class="caption-text"  x="80" y="888">  ·  Off-chain — Trading Engine refuses to forward a passing P&amp;L to the signers if any rule was breached during trading.</text>
  <text class="caption-text"  x="80" y="910">  ·  On-chain — ChainFundedPool re-checks every rule inside claimPayout and reverts the whole tx if any one fails.</text>
  <text class="caption-text"  x="80" y="932">A USDC payout requires both gates to agree. Either one alone is sufficient to stop a breached account being paid.</text>
</svg>
