<?xml version="1.0" encoding="UTF-8"?>
<!--
  ChainFunded whitepaper — Diagram 1
  Contract topology — what calls what.

  Hub-and-spoke. ChainFundedPool sits at the centre; satellite
  contracts and off-chain services orbit it with labelled
  read/write edges. Same Evergreen light palette as Figs 1–4.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="'Inter','Helvetica Neue',system-ui,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b62"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg          { fill: #f7faf8; }
    .hub         { fill: #ecfdf5; stroke: #15803d; stroke-width: 2.25; }
    .hub-title   { fill: #142019; font-size: 22px; font-weight: 800; text-anchor: middle; }
    .hub-sub     { fill: #15803d; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; letter-spacing: 0.12em; }
    .hub-meta    { fill: #536b5e; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .satellite   { fill: #ffffff; stroke: #c4d4cb; stroke-width: 1.5; }
    .satellite-on { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.75; }
    .sat-title   { fill: #142019; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sat-sub     { fill: #536b5e; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .edge        { stroke: #5a6b62; stroke-width: 1.5; fill: none; }
    .edge-p      { stroke: #15803d; stroke-width: 2; fill: none; }
    .edge-label  { fill: #2a3d34; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .edge-label-p { fill: #15803d; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .title       { fill: #142019; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle    { fill: #536b5e; font-size: 12px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; letter-spacing: 0.18em; text-transform: uppercase; }
    .legend-text { fill: #536b5e; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; }
  ]]></style>

  <rect class="bg" x="0" y="0" width="1280" height="900"/>

  <text class="subtitle" x="64" y="56">Figure 1 · Contract topology</text>
  <text class="title"    x="64" y="88">What calls what — protocol surface at a glance</text>

  <!-- Hub: ChainFundedPool (center) -->
  <rect class="hub" x="490" y="380" width="300" height="140" rx="14"/>
  <text class="hub-sub"   x="640" y="412">ON-CHAIN · UUPS PROXY</text>
  <text class="hub-title" x="640" y="450">ChainFundedPool</text>
  <text class="hub-meta"  x="640" y="478">register · settle · payout</text>
  <text class="hub-meta"  x="640" y="496">owns CFND · multisig-gated</text>

  <!-- Satellites -->
  <!-- USDC (left) -->
  <rect class="satellite-on" x="80" y="410" width="200" height="80" rx="10"/>
  <text class="sat-title" x="180" y="442">USDC</text>
  <text class="sat-sub"   x="180" y="462">ERC-20 · Circle</text>
  <text class="sat-sub"   x="180" y="478">on-chain</text>

  <!-- CFND (bottom centre-left) -->
  <rect class="satellite-on" x="380" y="640" width="200" height="80" rx="10"/>
  <text class="sat-title" x="480" y="672">CFND token</text>
  <text class="sat-sub"   x="480" y="692">LP share · 1:1 NAV</text>
  <text class="sat-sub"   x="480" y="708">owned by Pool</text>

  <!-- Trading Engine (top right) -->
  <rect class="satellite" x="1000" y="180" width="200" height="80" rx="10"/>
  <text class="sat-title" x="1100" y="212">Trading Engine</text>
  <text class="sat-sub"   x="1100" y="232">off-chain · in-app</text>
  <text class="sat-sub"   x="1100" y="248">P&amp;L · rule enforcement</text>

  <!-- Payout Signers (right) -->
  <rect class="satellite" x="1000" y="410" width="200" height="80" rx="10"/>
  <text class="sat-title" x="1100" y="442">Payout Signers</text>
  <text class="sat-sub"   x="1100" y="462">N-of-M multisig</text>
  <text class="sat-sub"   x="1100" y="478">off-chain</text>

  <!-- Trader (top left) -->
  <rect class="satellite" x="80" y="180" width="200" height="80" rx="10"/>
  <text class="sat-title" x="180" y="212">Trader</text>
  <text class="sat-sub"   x="180" y="232">EOA</text>
  <text class="sat-sub"   x="180" y="248">pays fee · claims payout</text>

  <!-- LP (top centre) -->
  <rect class="satellite" x="490" y="180" width="300" height="80" rx="10"/>
  <text class="sat-title" x="640" y="212">Liquidity Provider</text>
  <text class="sat-sub"   x="640" y="232">EOA</text>
  <text class="sat-sub"   x="640" y="248">deposit / claim profit / withdraw</text>

  <!-- ─── Edges ─────────────────────────────────────────────────────── -->
  <!-- Trader → Pool -->
  <path class="edge" d="M 280 220 L 490 380" marker-end="url(#ah)"/>
  <text class="edge-label" x="365" y="290">registerChallenge</text>
  <text class="edge-label" x="365" y="306">claimPayout</text>

  <!-- LP → Pool -->
  <line class="edge" x1="640" y1="260" x2="640" y2="378" marker-end="url(#ah)"/>
  <text class="edge-label" x="640" y="320">deposit · claimProfit · withdraw</text>

  <!-- Pool ↔ USDC (primary, two-headed) -->
  <line class="edge-p" x1="490" y1="450" x2="280" y2="450" marker-end="url(#ahp)" marker-start="url(#ahp)"/>
  <text class="edge-label-p" x="385" y="442">USDC ↔ Pool</text>
  <text class="edge-label" x="385" y="468">transferFrom · transfer</text>

  <!-- Pool ↔ CFND (mint/burn, primary) -->
  <line class="edge-p" x1="555" y1="520" x2="480" y2="640" marker-end="url(#ahp)"/>
  <text class="edge-label-p" x="475" y="586">mint · burn</text>

  <!-- Trading Engine → Pool (signed proof submission via signers) -->
  <path class="edge" d="M 1000 220 C 900 250 850 320 850 378" marker-end="url(#ah)"/>
  <text class="edge-label" x="950" y="280">signs P&amp;L</text>
  <text class="edge-label" x="950" y="296">to signers</text>

  <!-- Payout Signers → Pool (signatures verified inside claimPayout/registerPhase2) -->
  <line class="edge" x1="1000" y1="450" x2="790" y2="450" marker-end="url(#ah)"/>
  <text class="edge-label" x="895" y="442">N signatures</text>
  <text class="edge-label" x="895" y="468">verified in-tx</text>

  <!-- ── Legend ─────────────────────────────────────────────────────── -->
  <rect class="satellite-on" x="64" y="822" width="22" height="22" rx="4"/>
  <text class="legend-text" x="98" y="838">on-chain contract</text>
  <rect class="satellite" x="280" y="822" width="22" height="22" rx="4"/>
  <text class="legend-text" x="314" y="838">off-chain participant</text>
  <line class="edge-p" x1="500" y1="833" x2="556" y2="833" marker-end="url(#ahp)"/>
  <text class="legend-text" x="564" y="838">USDC / token movement</text>
  <line class="edge" x1="800" y1="833" x2="856" y2="833" marker-end="url(#ah)"/>
  <text class="legend-text" x="864" y="838">read / call</text>
</svg>
