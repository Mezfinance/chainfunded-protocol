<?xml version="1.0" encoding="UTF-8"?>
<!--
  ChainFunded whitepaper — Diagram 6
  Challenge fee split breakdown.

  Companion to Diagram 2 step 1 — shows where every USDC of an
  evaluation fee goes by BPS, sourced from on-chain constants in
  ChainFundedPool.sol (FEE_PROTOCOL_BPS=2400, FEE_PROFIT_POOL_BPS=600,
  MAX_AFFILIATE_BPS=2000).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Inter','Helvetica Neue',system-ui,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg          { fill: #f7faf8; }
    .title       { fill: #142019; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle    { fill: #536b5e; font-size: 12px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; letter-spacing: 0.18em; text-transform: uppercase; }
    .pill        { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.75; }
    .pool-box    { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
    .dest-box    { fill: #ffffff; stroke: #c4d4cb; stroke-width: 1.5; }
    .dest-affil  { fill: #ffffff; stroke: #c4d4cb; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .pill-text   { fill: #142019; font-size: 18px; font-weight: 700; text-anchor: middle; }
    .pool-text   { fill: #15803d; font-size: 16px; font-weight: 800; text-anchor: middle; }
    .pool-sub    { fill: #15803d; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .dest-pct    { fill: #15803d; font-size: 26px; font-weight: 800; text-anchor: middle; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; }
    .dest-label  { fill: #142019; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .dest-sub    { fill: #536b5e; font-size: 11px; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .arrow       { stroke: #15803d; stroke-width: 2.25; fill: none; }
    .arrow-label { fill: #15803d; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; text-anchor: middle; }
    .arrow-aff   { stroke: #15803d; stroke-width: 2.25; fill: none; stroke-dasharray: 6 4; }
  ]]></style>

  <rect class="bg" x="0" y="0" width="1280" height="720"/>

  <!-- Title -->
  <text class="subtitle" x="64" y="56">Figure 6 · Evaluation fee allocation</text>
  <text class="title"    x="64" y="88">Where every USDC of a challenge fee goes</text>

  <!-- ─── Source pill — Trader fee 100% ─────────────────────────────── -->
  <rect class="pill" x="500" y="130" width="280" height="64" rx="32"/>
  <text class="pill-text" x="640" y="170">Trader fee · 100%</text>

  <!-- Flow down -->
  <line class="arrow" x1="640" y1="194" x2="640" y2="240" marker-end="url(#ah)"/>

  <!-- ─── ChainFundedPool ───────────────────────────────────────────── -->
  <rect class="pool-box" x="460" y="248" width="360" height="78" rx="6"/>
  <text class="pool-text" x="640" y="280">ChainFundedPool</text>
  <text class="pool-sub"  x="640" y="304">registerChallenge() · splits at settlement</text>

  <!-- Fan-out lines from Pool bottom (640,326) to destination box tops -->
  <!-- Destinations evenly spaced: 150, 460, 770, 1080 (centers) -->
  <path class="arrow"     d="M 640 326 C 640 380 200 380 200 470" marker-end="url(#ah)"/>
  <path class="arrow"     d="M 640 326 C 640 380 510 380 510 470" marker-end="url(#ah)"/>
  <path class="arrow-aff" d="M 640 326 C 640 380 820 380 820 470" marker-end="url(#ah)"/>
  <path class="arrow"     d="M 640 326 C 640 380 1130 380 1130 470" marker-end="url(#ah)"/>

  <!-- Flow labels on the curves -->
  <text class="arrow-label" x="195"  y="395">24%</text>
  <text class="arrow-label" x="510"  y="395">6%</text>
  <text class="arrow-label" x="820"  y="395">0–20%</text>
  <text class="arrow-label" x="1130" y="395">remainder</text>

  <!-- ─── Destination 1 · Protocol revenue ─────────────────────────── -->
  <rect class="dest-box" x="80" y="478" width="240" height="160" rx="6"/>
  <text class="dest-pct"   x="200" y="525">24%</text>
  <text class="dest-label" x="200" y="555">Protocol revenue</text>
  <text class="dest-sub"   x="200" y="580">labsWallet</text>
  <text class="dest-sub"   x="200" y="600">FEE_PROTOCOL_BPS</text>
  <text class="dest-sub"   x="200" y="620">funds Labs operations</text>

  <!-- ─── Destination 2 · LP yield ─────────────────────────────────── -->
  <rect class="dest-box" x="390" y="478" width="240" height="160" rx="6"/>
  <text class="dest-pct"   x="510" y="525">6%</text>
  <text class="dest-label" x="510" y="555">LP yield pool</text>
  <text class="dest-sub"   x="510" y="580">distributed per-CFND</text>
  <text class="dest-sub"   x="510" y="600">FEE_PROFIT_POOL_BPS</text>
  <text class="dest-sub"   x="510" y="620">claimable via claimProfit()</text>

  <!-- ─── Destination 3 · Affiliate (optional) ─────────────────────── -->
  <rect class="dest-affil" x="700" y="478" width="240" height="160" rx="6"/>
  <text class="dest-pct"   x="820" y="525">0–20%</text>
  <text class="dest-label" x="820" y="555">Affiliate wallet</text>
  <text class="dest-sub"   x="820" y="580">only if referrer set</text>
  <text class="dest-sub"   x="820" y="600">tiered by monthly volume</text>
  <text class="dest-sub"   x="820" y="620">cap MAX_AFFILIATE_BPS</text>

  <!-- ─── Destination 4 · LP capital ───────────────────────────────── -->
  <rect class="dest-box" x="1010" y="478" width="240" height="160" rx="6"/>
  <text class="dest-pct"   x="1130" y="525">50–70%</text>
  <text class="dest-label" x="1130" y="555">LP capital reserves</text>
  <text class="dest-sub"   x="1130" y="580">backs trader payouts</text>
  <text class="dest-sub"   x="1130" y="600">stays inside Pool</text>
  <text class="dest-sub"   x="1130" y="620">withdrawable by LPs</text>

  <!-- Caption -->
  <text class="subtitle" x="64" y="685">Source · contracts/contracts/ChainFundedPool.sol — FEE_PROTOCOL_BPS=2400 · FEE_PROFIT_POOL_BPS=600 · MAX_AFFILIATE_BPS=2000</text>
</svg>
